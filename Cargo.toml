[package]
name = "phoxal-robot-project"
version = "0.0.0-dev.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace]
resolver = "3"

[workspace.dependencies]
phoxal = { registry = "phoxal", version = "=0.0.0-dev.3" }
phoxal-supervisor = { registry = "phoxal", version = "=0.0.0-dev.3" }


[dependencies]
phoxal.workspace = true
phoxal-supervisor.workspace = true

[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
phoxal = { registry = "phoxal", version = "=0.0.0-dev.3", features = ["scenario"] }

[build-dependencies]
phoxal = { registry = "phoxal", version = "=0.0.0-dev.3", default-features = false, features = ["build"] }

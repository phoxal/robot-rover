[package]
name = "phoxal-robot-project"
version = "0.0.0-dev.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace]
resolver = "3"

# Local-path framework selection keeps this robot testable against the
# in-development framework checkout beside it; the published registry
# remains the dependency source for production robots.
[workspace.dependencies]
phoxal = { path = "../framework/phoxal" }
phoxal-supervisor = { path = "../framework/supervisor" }


[dependencies]
phoxal.workspace = true
phoxal-supervisor.workspace = true

[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
phoxal = { path = "../framework/phoxal", features = ["scenario"] }

[build-dependencies]
phoxal = { path = "../framework/phoxal", default-features = false, features = ["build"] }

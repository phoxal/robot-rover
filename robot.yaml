# $schema: ./.phoxal/schemas/robot.schema.json
schema: phoxal/robot/v0
robot:
  id: robot-rover
  model: model.xml
  components:
    front_left_drive:
      source: { git: { name: phoxal-component-ddsm115, url: https://github.com/phoxal/components.git, rev: 8d532c41c9125a5bb5aa1941f37be7294a32892a, path: ddsm115 } }
      mount_site: front_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 1
    front_right_drive:
      source: { git: { name: phoxal-component-ddsm115, url: https://github.com/phoxal/components.git, rev: 8d532c41c9125a5bb5aa1941f37be7294a32892a, path: ddsm115 } }
      mount_site: front_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 2
    rear_left_drive:
      source: { git: { name: phoxal-component-ddsm115, url: https://github.com/phoxal/components.git, rev: 8d532c41c9125a5bb5aa1941f37be7294a32892a, path: ddsm115 } }
      mount_site: rear_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 3
    rear_right_drive:
      source: { git: { name: phoxal-component-ddsm115, url: https://github.com/phoxal/components.git, rev: 8d532c41c9125a5bb5aa1941f37be7294a32892a, path: ddsm115 } }
      mount_site: rear_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 4
    front_center_tof:
      source: { git: { name: phoxal-component-vl53l1x, url: https://github.com/phoxal/components.git, rev: 8d532c41c9125a5bb5aa1941f37be7294a32892a, path: vl53l1x } }
      mount_site: front_center_tof_mount
      driver:
        connection:
          type: i2c
          bus: 1
          address: 41
supervisor:
  source:
    git: { name: phoxal-supervisor, url: https://github.com/phoxal/supervisor.git, rev: 8237e88b0d3d64b2bb39ac35328dc9287a4faea7 }

brain: {}

services:
  kinematics:
    source: { git: { name: phoxal-service-kinematics, url: https://github.com/phoxal/services.git, rev: 38030e8fb96b782c7a2419d1176e7ecc05828865, path: kinematics } }
    config:
      wheel_radius_m: 0.11
      wheel_base_m: 0.52
      left_wheels:
        - encoder_id: front_left_drive
          joint_id: front_left_wheel
          longitudinal_offset_m: 0.18
          direction_sign: 1
        - encoder_id: rear_left_drive
          joint_id: rear_left_wheel
          longitudinal_offset_m: -0.18
          direction_sign: 1
      right_wheels:
        - encoder_id: front_right_drive
          joint_id: front_right_wheel
          longitudinal_offset_m: 0.18
          direction_sign: -1
        - encoder_id: rear_right_drive
          joint_id: rear_right_wheel
          longitudinal_offset_m: -0.18
          direction_sign: -1
  world:
    source: { git: { name: phoxal-service-world, url: https://github.com/phoxal/services.git, rev: 38030e8fb96b782c7a2419d1176e7ecc05828865, path: world } }
  navigation:
    source: { git: { name: phoxal-service-navigation, url: https://github.com/phoxal/services.git, rev: 38030e8fb96b782c7a2419d1176e7ecc05828865, path: navigation } }
    config:
      max_expansions_per_step: 32
      goal_tolerance_m: 0.1
  safety:
    source: { git: { name: phoxal-service-safety, url: https://github.com/phoxal/services.git, rev: 38030e8fb96b782c7a2419d1176e7ecc05828865, path: safety } }
    config:
      # Preserve the measured composition budget through canonical runtime
      # conversion: the brain and services retain their 20 ms cadence.
      # The existing 120 ms bound and native movement/stop assertions stay
      # unchanged and are qualified together after the authoring cutover.
      input_max_age_ms: 120
      ranges:
        - sensor_id: front_center_tof
  motion:
    source: { git: { name: phoxal-service-motion, url: https://github.com/phoxal/services.git, rev: 38030e8fb96b782c7a2419d1176e7ecc05828865, path: motion } }
    config:
      wheel_radius_m: 0.11
      wheel_base_m: 0.52
      max_linear_mps: 0.6
      max_angular_radps: 2.0
      left_wheels:
        - actuator_id: front_left_drive.motor
          direction_sign: 1
        - actuator_id: rear_left_drive.motor
          direction_sign: 1
      right_wheels:
        - actuator_id: front_right_drive.motor
          direction_sign: -1
        - actuator_id: rear_right_drive.motor
          direction_sign: -1

connections:
  front_left_drive.actuator: motion.actuators
  rear_left_drive.actuator: motion.actuators
  front_right_drive.actuator: motion.actuators
  rear_right_drive.actuator: motion.actuators
  kinematics.encoders:
    - front_left_drive.encoder
    - rear_left_drive.encoder
    - front_right_drive.encoder
    - rear_right_drive.encoder
  world.pose: kinematics.odometry
  safety.world: world.belief
  safety.world_revision: world.revision
  safety.motion: motion.status
  safety.ranges: front_center_tof.range
  motion.safety: safety.constraints
  motion.measurements: kinematics.odometry
  motion.manual: brain.manual
  motion.autonomous: brain.autonomous
  navigation.localization: kinematics.odometry
  navigation.map: world.revision

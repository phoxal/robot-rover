schema: phoxal/robot/v0
robot:
  id: robot-rover
  model: model.xml
  components:
    front_left_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: 9aeb9c53c79ec2f0ed886330116b451e96c78d6c
          path: ddsm115
      mount_site: front_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 1
    front_right_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: 9aeb9c53c79ec2f0ed886330116b451e96c78d6c
          path: ddsm115
      mount_site: front_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 2
    rear_left_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: 9aeb9c53c79ec2f0ed886330116b451e96c78d6c
          path: ddsm115
      mount_site: rear_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 3
    rear_right_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: 9aeb9c53c79ec2f0ed886330116b451e96c78d6c
          path: ddsm115
      mount_site: rear_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 4
supervisor:
  source:
    git:
      name: phoxal-supervisor
      url: https://github.com/phoxal/supervisor.git
      rev: 087da0b8a38f71c64601f2f9c1d5a39b306a6f3b
brain: {}
services:
  motion:
    source:
      git:
        name: phoxal-service-motion
        url: https://github.com/phoxal/services.git
        rev: 14aa9a7a5250c85622b5c8a640636d202e7f60bb
        path: motion
    config:
      max_linear_mps: 0.6
      max_angular_radps: 2.0
      drive:
        differential:
          # Authored example calibration, not model-derived measurements.
          wheel_radius_m: 0.11
          track_width_m: 0.52
          wheels:
            front_left:
              side: left
              direction_sign: 1
            rear_left:
              side: left
              direction_sign: 1
            front_right:
              side: right
              direction_sign: -1
            rear_right:
              side: right
              direction_sign: -1
connections:
- from: motion.front_left_actuator
  to: front_left_drive.actuator
- from: motion.rear_left_actuator
  to: rear_left_drive.actuator
- from: motion.front_right_actuator
  to: front_right_drive.actuator
- from: motion.rear_right_actuator
  to: rear_right_drive.actuator

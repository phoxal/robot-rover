# $schema: ./.phoxal/schemas/robot.schema.json
schema: phoxal/robot/v0
robot:
  id: robot-rover
  model: model.xml
  motion_limits:
    max_linear_speed_mps: 0.6
    max_angular_speed_radps: 2.0
  kinematic:
    kind: differential
    left_actuators:
      - front_left_drive.motor
      - rear_left_drive.motor
    right_actuators:
      - front_right_drive.motor
      - rear_right_drive.motor
    left_encoders:
      - front_left_drive.encoder
      - rear_left_drive.encoder
    right_encoders:
      - front_right_drive.encoder
      - rear_right_drive.encoder
    wheel_radius_m: 0.1
    wheel_base_m: 0.52
  components:
    front_left_drive:
      component: ddsm115
      mount_site: front_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 1
    front_right_drive:
      component: ddsm115
      mount_site: front_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 2
    rear_left_drive:
      component: ddsm115
      mount_site: rear_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 3
    rear_right_drive:
      component: ddsm115
      mount_site: rear_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 4
    imu:
      component: bno085
      mount_site: imu_mount
      driver:
        connection:
          type: i2c
          bus: 1
          address: 74
    front_camera:
      component: oak_d_lite
      mount_site: front_camera_mount
      driver:
        connection:
          type: usb
    front_center_tof:
      component: vl53l1x
      mount_site: front_center_tof_mount
      driver:
        connection:
          type: i2c
          bus: 1
          address: 41
    gnss:
      component: zed_f9p
      mount_site: gnss_mount
      driver:
        connection:
          type: usb
brain: {}

services: {}

connections: {}

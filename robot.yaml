# $schema: ./.phoxal/schemas/robot.schema.json
schema: phoxal/robot/v0
robot:
  id: robot-rover
  model: model.xml
  components:
    front_left_drive:
      source: { package: { name: phoxal-component-ddsm115, version: 0.0.0-dev.7 } }
      mount_site: front_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 1
    front_right_drive:
      source: { package: { name: phoxal-component-ddsm115, version: 0.0.0-dev.7 } }
      mount_site: front_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 2
    rear_left_drive:
      source: { package: { name: phoxal-component-ddsm115, version: 0.0.0-dev.7 } }
      mount_site: rear_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 3
    rear_right_drive:
      source: { package: { name: phoxal-component-ddsm115, version: 0.0.0-dev.7 } }
      mount_site: rear_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 4
    front_center_tof:
      source: { package: { name: phoxal-component-vl53l1x, version: 0.0.0-dev.7 } }
      mount_site: front_center_tof_mount
      driver:
        connection:
          type: i2c
          bus: 1
          address: 41
brain: {}

services:
  kinematics:
    source: { package: { name: phoxal-service-kinematics, version: 0.0.0-dev.7 } }
    config:
      wheel_radius_m: 0.11
      wheel_base_m: 0.52
      left_wheels:
        - encoder_id: front_left_drive
          joint_id: front_left_wheel
          longitudinal_offset_m: 0.18
          direction_sign: 1
        - encoder_id: rear_left_drive
          joint_id: rear_left_wheel
          longitudinal_offset_m: -0.18
          direction_sign: 1
      right_wheels:
        - encoder_id: front_right_drive
          joint_id: front_right_wheel
          longitudinal_offset_m: 0.18
          direction_sign: -1
        - encoder_id: rear_right_drive
          joint_id: rear_right_wheel
          longitudinal_offset_m: -0.18
          direction_sign: -1
  world:
    source: { package: { name: phoxal-service-world, version: 0.0.0-dev.7 } }
  safety:
    source: { package: { name: phoxal-service-safety, version: 0.0.0-dev.7 } }
    config:
      # Measured composition budget. The hosted conversion role forwards
      # on arrival in hardware mode (no adapter tick); controlled
      # simulation steps every runtime at strict input cuts, and its
      # deterministic phase alignment across the two converted hops
      # (world→safety, safety→motion) consumes exactly 100.0 ms — the
      # original budget fails at exact equality (3/3 runs) and 101 ms
      # passes. 120 ms keeps 20% margin over the measured requirement and
      # refuses staler constraints than the previous 200 ms headroom.
      input_max_age_ms: 120
      ranges:
        - sensor_id: front_center_tof
  motion:
    source: { package: { name: phoxal-service-motion, version: 0.0.0-dev.7 } }
    config:
      wheel_radius_m: 0.11
      wheel_base_m: 0.52
      max_linear_mps: 0.6
      max_angular_radps: 2.0
      left_wheels:
        - actuator_id: front_left_drive.motor
          direction_sign: 1
        - actuator_id: rear_left_drive.motor
          direction_sign: 1
      right_wheels:
        - actuator_id: front_right_drive.motor
          direction_sign: -1
        - actuator_id: rear_right_drive.motor
          direction_sign: -1

connections:
  front_left_drive.actuator: motion.actuators
  rear_left_drive.actuator: motion.actuators
  front_right_drive.actuator: motion.actuators
  rear_right_drive.actuator: motion.actuators
  kinematics.encoders:
    - front_left_drive.encoder
    - rear_left_drive.encoder
    - front_right_drive.encoder
    - rear_right_drive.encoder
  world.pose: kinematics.odometry
  safety.world: world.belief
  safety.world_revision: world.revision
  safety.motion: motion.status
  safety.ranges: front_center_tof.range
  motion.safety: safety.constraints
  motion.measurements: kinematics.odometry
  motion.manual: brain.manual
  motion.autonomous: brain.autonomous

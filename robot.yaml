# $schema: ./.phoxal/schemas/robot.schema.json
schema: phoxal/robot/v0
robot:
  id: robot-rover
  model: model.xml
  components:
    front_left_drive:
      source: { path: ../framework/components/ddsm115 }
      mount_site: front_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 1
    front_right_drive:
      source: { path: ../framework/components/ddsm115 }
      mount_site: front_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 2
    rear_left_drive:
      source: { path: ../framework/components/ddsm115 }
      mount_site: rear_left_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 3
    rear_right_drive:
      source: { path: ../framework/components/ddsm115 }
      mount_site: rear_right_wheel_mount
      driver:
        connection:
          type: serial
          port: /dev/ttyUSB0
          baud: 115200
        config:
          id: 4
    front_center_tof:
      source: { path: ../framework/components/vl53l1x }
      mount_site: front_center_tof_mount
      driver:
        connection:
          type: i2c
          bus: 1
          address: 41
brain: {}

services:
  kinematics:
    source: { path: ../framework/services/kinematics }
    config:
      wheel_radius_m: 0.11
      wheel_base_m: 0.52
      left_wheels:
        - encoder_id: front_left_drive
          joint_id: front_left_wheel
          longitudinal_offset_m: 0.18
          direction_sign: 1
        - encoder_id: rear_left_drive
          joint_id: rear_left_wheel
          longitudinal_offset_m: -0.18
          direction_sign: 1
      right_wheels:
        - encoder_id: front_right_drive
          joint_id: front_right_wheel
          longitudinal_offset_m: 0.18
          direction_sign: -1
        - encoder_id: rear_right_drive
          joint_id: rear_right_wheel
          longitudinal_offset_m: -0.18
          direction_sign: -1
  world:
    source: { path: ../framework/services/world }
  safety:
    source: { path: ../framework/services/safety }
    config:
      # The conversion adapter between world/motion and safety adds delivery
      # hops; the extra headroom keeps the published constraint window valid
      # by the time Motion consumes it.
      input_max_age_ms: 200
      ranges:
        - sensor_id: front_center_tof
  motion:
    source: { path: ../framework/services/motion }
    config:
      wheel_radius_m: 0.11
      wheel_base_m: 0.52
      max_linear_mps: 0.6
      max_angular_radps: 2.0
      left_wheels:
        - actuator_id: front_left_drive.motor
          direction_sign: 1
        - actuator_id: rear_left_drive.motor
          direction_sign: 1
      right_wheels:
        - actuator_id: front_right_drive.motor
          direction_sign: -1
        - actuator_id: rear_right_drive.motor
          direction_sign: -1

connections:
  front_left_drive.actuator: motion.actuators
  rear_left_drive.actuator: motion.actuators
  front_right_drive.actuator: motion.actuators
  rear_right_drive.actuator: motion.actuators
  kinematics.encoders:
    - front_left_drive.encoder
    - rear_left_drive.encoder
    - front_right_drive.encoder
    - rear_right_drive.encoder
  world.pose: kinematics.odometry
  safety.world: world.belief
  safety.world_revision: world.revision
  safety.motion: motion.status
  safety.ranges: front_center_tof.range
  motion.safety: safety.constraints
  motion.measurements: kinematics.odometry
  motion.manual: brain.manual
  motion.autonomous: brain.autonomous

name: ci

# Deterministic composition checks use the published CLI and pinned participant sources.
# Native movement and desktop controls are explicit host acceptance with user-managed MuJoCo.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Cargo install and project builds share the cache restored below.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install the published CLI
        run: |
          set -euo pipefail
          cargo install cargo-phoxal --locked --root "$RUNNER_TEMP/cli"
      - run: cargo fmt --all -- --check
      - name: Prepare the pinned composition
        run: ${{ runner.temp }}/cli/bin/cargo-phoxal prepare
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check the compiled contracts
        run: ${{ runner.temp }}/cli/bin/cargo-phoxal check
      - name: Compile the explicitly executed scenario
        run: cargo check --example forward-stop --locked
      - name: Run ordinary Rust tests
        run: cargo test --locked

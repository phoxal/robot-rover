[package]
name = "scenario"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Rover-first scenario driver: publishes scripted MotionIntent setpoints to motion.manual."

[package.metadata.phoxal]
kind = "service"

[lib]
name = "scenario"
path = "src/lib.rs"

[[bin]]
name = "phoxal-rover-scenario"
path = "src/main.rs"

[dependencies]
phoxal.workspace = true
motion = { package = "phoxal-service-motion", workspace = true }
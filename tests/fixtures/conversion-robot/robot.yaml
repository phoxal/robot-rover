schema: phoxal/robot/v0
robot:
  id: phoxal-conversion-robot
  model: model/robot.xml
brain: { binary: brain }
services:
  navigation:
    source: { git: { name: phoxal-service-navigation, url: https://github.com/phoxal/services.git, rev: 38030e8fb96b782c7a2419d1176e7ecc05828865, path: navigation } }
    config: { max_expansions_per_step: 32, goal_tolerance_m: 0.1 }
  world:
    source: { git: { name: phoxal-service-world, url: https://github.com/phoxal/services.git, rev: 38030e8fb96b782c7a2419d1176e7ecc05828865, path: world } }
connections:
  navigation.localization: brain.odometry
  world.pose: brain.odometry
  navigation.map: world.revision
  brain.world_status: world.revision

supervisor:
  source: { git: { name: phoxal-supervisor, url: https://github.com/phoxal/supervisor.git, rev: 8237e88b0d3d64b2bb39ac35328dc9287a4faea7 } }
